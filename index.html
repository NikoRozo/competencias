const textoSubdim = (sd, nivel) => {
  if (sd.orig && sd.orig[nivel]) return { texto: sd.orig[nivel], sintetico: false };
  return { texto: PLANTILLAS_SUB[nivel] ? PLANTILLAS_SUB[nivel](sd.foco) : "", sintetico: true };
};

const narrativaComp = (comp, nivel) => {
  const o = NARRATIVAS_ORIG[comp.id];
  if (o && o.nivel === nivel) return { texto: o.texto, sintetico: false };
  const riesgo = (comp.descripcion || "").split("\n\n")[2] || "";
  return { texto: PLANTILLAS_NARR[nivel] ? PLANTILLAS_NARR[nivel](riesgo) : "", sintetico: true };
};

const calcularResultados = (resp) => {
  const out = {};
  todasLasCompetencias.forEach((c) => {
    const subs = SUBDIMENSIONES[c.id] || [];
    const r = resp[c.id] || {};
    const items = [];
    const subsRes = subs.map((sd) => {
      const vals = sd.q
        .map((i) => (r[i] === undefined ? null : sd.inv.includes(i) ? 5 - r[i] : r[i]))
        .filter((v) => v !== null);
      vals.forEach((v) => items.push(v));
      const score = vals.length ? ((vals.reduce((a, b) => a + b, 0) / vals.length - 1) / 3) * 10 : null;
      return { ...sd, score, nivel: nivelDe(score) };
    });
    const score = items.length ? ((items.reduce((a, b) => a + b, 0) / items.length - 1) / 3) * 10 : null;
    out[c.id] = { score, nivel: nivelDe(score), subs: subsRes };
  });
  return out;
};

    h += "<tr><td class=n>" + esc(p.nombre) + "</td>";
    todasLasCompetencias.forEach((c) => {
      const r = res[c.id]; const inf = r.nivel ? nivelInfo(r.nivel) : null;
      h += "<td style=\"background:" + (inf ? inf.color + "22" : "#fff") + "\">" + fmt(r.score) + "</td>";
    });
    h += "<td><b>" + (con.length ? fmt(con.reduce((a, b) => a + b, 0) / con.length) : "&mdash;") + "</b></td></tr>";
  });
  h += "</table><p style=\"color:#999;font-size:12px\">Generado " + new Date().toLocaleDateString("es-CO") + "</p></div></body></html>";
  return h;
};

</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [sesion, setSesion] = useState(null);          // { clave, persona }
  const [respuestas, setRespuestas] = useState({});
  const [cargando, setCargando] = useState(true);
  const [vista, setVista] = useState("matriz");        // recos | matriz | intro | form | admin
  const [activa, setActiva] = useState(null);
  const [pagina, setPagina] = useState(0);
  const [claveInput, setClaveInput] = useState("");
  const [errorClave, setErrorClave] = useState("");
  const [ingresando, setIngresando] = useState(false);
  const [sync, setSync] = useState({ pendientes: 0, error: null });
  const [adminDatos, setAdminDatos] = useState(null);
  const [importTexto, setImportTexto] = useState("");
  const [importMsg, setImportMsg] = useState(null);
  const cola = useRef([]);
  const enviando = useRef(false);

  // ---- sesión recordada en este navegador ----
  useEffect(() => {
    (async () => {
      try {
        const guardada = JSON.parse(localStorage.getItem("competencias-sesion") || "null");
        if (guardada && guardada.clave) {
          const r = await api({ action: "cargar", clave: guardada.clave });
          if (r.ok) { setSesion({ clave: guardada.clave, persona: r.persona }); setRespuestas(r.respuestas || {}); }
          else localStorage.removeItem("competencias-sesion");
        }
      } catch (e) { /* sin red o sin sesión */ }
      setCargando(false);
    })();
  }, []);

  const ingresar = async () => {
    setIngresando(true); setErrorClave("");
    try {
      const r = await api({ action: "login", clave: claveInput });
      if (!r.ok) { setErrorClave(r.error || "Clave no reconocida"); }
      else {
        localStorage.setItem("competencias-sesion", JSON.stringify({ clave: claveInput }));
        setSesion({ clave: claveInput, persona: r.persona });
        setRespuestas(r.respuestas || {});
        setClaveInput("");
        setVista("recos");
      }
    } catch (e) { setErrorClave("No se pudo conectar con el servidor. Verifica tu conexión."); }
    setIngresando(false);
  };
  const cerrarSesion = () => {
    localStorage.removeItem("competencias-sesion");
    setSesion(null); setRespuestas({}); setActiva(null); setVista("matriz"); setAdminDatos(null);
  };

  // ---- guardado: UI optimista + cola secuencial con reintento ----
  const procesarCola = async () => {
    if (enviando.current || cola.current.length === 0) return;
    enviando.current = true;
    while (cola.current.length > 0) {
      const item = cola.current[0];
      try {
        const r = await api({ action: "guardar", clave: sesion.clave, ...item });
        if (!r.ok) throw new Error(r.error || "Error al guardar");
        cola.current.shift();
        setSync({ pendientes: cola.current.length, error: null });
      } catch (e) {
        setSync({ pendientes: cola.current.length, error: "Sin conexión: reintentando…" });
        await new Promise((res) => setTimeout(res, 3000));
      }
    }
    enviando.current = false;
  };
  const responder = (cid, idx, valor) => {
    setRespuestas((prev) => ({ ...prev, [cid]: { ...(prev[cid] || {}), [idx]: valor } }));
    const info = infoPregunta(cid, idx);
    cola.current.push({ competencia: cid, pregunta: idx, valor, inversa: info.inversa, subdimension: info.subdimension });
    setSync((s) => ({ ...s, pendientes: cola.current.length }));
    procesarCola();
  };

  // ---- helpers de estado ----
  const contestadas = (id) => Object.keys(respuestas[id] || {}).length;
  const totalDe = (id) => todasLasCompetencias.find((c) => c.id === id).preguntas.length;
  const estadoDe = (id) => { const n = contestadas(id); return n === 0 ? "pendiente" : n >= totalDe(id) ? "completada" : "progreso"; };
  const siguientePendiente = () => (todasLasCompetencias.find((c) => estadoDe(c.id) === "progreso") || todasLasCompetencias.find((c) => estadoDe(c.id) === "pendiente") || {}).id || null;
  const abrir = (id, directo) => {
    const comp = todasLasCompetencias.find((c) => c.id === id);
    const r = respuestas[id] || {};
    let idx = comp.preguntas.findIndex((_, i) => r[i] === undefined); if (idx === -1) idx = 0;
    setPagina(Math.floor(idx / PREGUNTAS_POR_PAGINA)); setActiva(id); setVista(directo ? "form" : "intro");
  };
  const contestadasGlobal = todasLasCompetencias.reduce((a, c) => a + contestadas(c.id), 0);
  const esAdmin = sesion && sesion.persona.rol === "admin";

  // ---- admin ----
  const cargarAdmin = async () => {
    setAdminDatos(null);
    try { const r = await api({ action: "admin_estado", clave: sesion.clave }); if (r.ok) setAdminDatos(r); else setImportMsg({ ok: false, texto: r.error }); }
    catch (e) { setImportMsg({ ok: false, texto: "No se pudo leer el servidor" }); }
  };
  const verGrupal = () => {
    if (!adminDatos) return;
    const datos = {};
    adminDatos.personas.forEach((p) => { datos[p.id] = adminDatos.estado[p.id] || { r: {}, t: null }; });
    const html = construirInformeGrupalHTML(adminDatos.personas, datos);
    window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank");
  };

  const exportarJSON = async () => {
    const r = await api({ action: "admin_exportar", clave: sesion.clave });
    if (r.ok) descargar("competencias-datos-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(r, null, 1), "application/json");
  };
  const exportarCSV = () => {
    if (!adminDatos) return;
    const filas = ["persona_id;nombre;competencia;titulo;pregunta;valor;valor_ajustado;subdimension"];
    adminDatos.personas.forEach((p) => {
      const r = (adminDatos.estado[p.id] || { r: {} }).r;
      todasLasCompetencias.forEach((c) => {
        Object.keys(r[c.id] || {}).sort((a, b) => a - b).forEach((i) => {
          const info = infoPregunta(c.id, Number(i)); const v = Number(r[c.id][i]);
          filas.push([p.id, p.nombre, c.id, c.titulo, Number(i) + 1, v, info.inversa ? 5 - v : v, info.subdimension].join(";"));
        });
      });
    });
    descargar("competencias-respuestas.csv", "\ufeff" + filas.join("\n"), "text/csv;charset=utf-8");
  };
  const importarJSON = async () => {
    setImportMsg(null);
    let obj; try { obj = JSON.parse(importTexto); } catch (e) { setImportMsg({ ok: false, texto: "JSON inválido: " + e.message }); return; }
    try {
      const r = await api({ action: "admin_importar", clave: sesion.clave, datos: obj, mapeo: MAPEO });
      if (r.ok) { setImportMsg({ ok: true, texto: r.detalle.length ? "Importado — " + r.detalle.join(" · ") : "Sin respuestas reconocibles" }); setImportTexto(""); cargarAdmin(); }
      else setImportMsg({ ok: false, texto: r.error });
    } catch (e) { setImportMsg({ ok: false, texto: "Error de conexión" }); }
  };

  const Barra = () => (sync.pendientes > 0 || sync.error) ? (
    <div className="fixed bottom-3 right-3 text-[11px] uppercase tracking-widest px-3 py-2 text-white z-50" style={{ backgroundColor: sync.error ? "#E74C3C" : "#333" }}>
      {sync.error ? sync.error : "Guardando… (" + sync.pendientes + ")"}
    </div>
  ) : null;

  if (cargando) return <div className="min-h-screen flex items-center justify-center text-gray-400 uppercase tracking-widest">Cargando…</div>;

  // ============================ INGRESO ============================
  if (!sesion) return (
    <div className="min-h-screen flex flex-col">
      <div className="bg-neutral-800 text-white px-6 md:px-16 py-10">
        <h1 className="uppercase text-2xl md:text-4xl font-semibold leading-tight max-w-2xl">Autodiagnóstico de competencias de transformación</h1>
        <p className="serif text-sm opacity-80 mt-3 max-w-xl">Ingresa tu clave personal para continuar con tu cuestionario. Tu avance queda guardado y puedes retomarlo en cualquier momento y desde cualquier dispositivo.</p>
      </div>
      <div className="flex-1 px-6 md:px-16 py-10 max-w-xl">
        <label className="uppercase text-xs tracking-widest text-gray-500">Clave de acceso</label>
        <input type="text" value={claveInput} onChange={(e) => { setClaveInput(e.target.value); setErrorClave(""); }} onKeyDown={(e) => { if (e.key === "Enter") ingresar(); }}
          placeholder="nombreapellido + año" autoFocus className="serif w-full border-b-2 bg-transparent py-3 mt-2 text-lg outline-none" style={{ borderColor: errorClave ? "#E74C3C" : "#333" }} />
        {errorClave && <p className="text-xs uppercase tracking-wide mt-2" style={{ color: "#E74C3C" }}>{errorClave}</p>}
        <p className="serif text-xs text-gray-400 mt-3">Tu clave es tu nombre completo (sin espacios ni tildes) seguido del año en curso. Mayúsculas, espacios y tildes no afectan.</p>
        <button onClick={ingresar} disabled={ingresando || !claveInput.trim()} className="mt-6 px-12 py-4 uppercase text-sm tracking-widest text-white disabled:opacity-40" style={{ backgroundColor: NARANJA }}>{ingresando ? "Verificando…" : "Ingresar"}</button>
        <p className="text-[10px] uppercase tracking-widest text-gray-300 mt-10">Versión {CONFIG.VERSION}</p>
      </div>
    </div>
  );

  // ============================ RECOMENDACIONES ============================
  if (vista === "recos") return (
    <div className="min-h-screen flex flex-col">
      <div className="bg-neutral-800 text-white px-6 md:px-16 py-10">
        <p className="uppercase text-xs tracking-widest opacity-70">{sesion.persona.nombre}</p>
        <h1 className="uppercase text-2xl md:text-4xl font-semibold leading-tight max-w-3xl mt-2">Estás a punto de empezar… últimas recomendaciones</h1>
      </div>
      <div className="flex-1 px-6 md:px-16 py-10 max-w-3xl serif text-base md:text-lg leading-relaxed text-neutral-800">
        <p className="mb-5">Te recordamos que completar el cuestionario te llevará aproximadamente 45-60 minutos. Busca un lugar tranquilo para poder reflexionar sobre tus comportamientos ante cada pregunta. Es importante que respondas con un sano sentido crítico para que el autodiagnóstico te resulte de máxima utilidad. No se trata de «pasar» un examen sino de identificar oportunidades de mejora.</p>
        <p>Puedes hacer una pausa en cualquier momento, aunque te recomendamos que lo hagas de una vez o, al menos, que no dejes una competencia a medias. Por último, recuerda que tanto la información que facilites como los resultados son tratados con la máxima confidencialidad y que solo los compartiremos contigo.</p>
      </div>
      <div className="bg-gray-100 px-6 md:px-16 py-5 flex justify-end">
        <button onClick={() => setVista("matriz")} className="px-12 py-4 uppercase text-sm tracking-widest text-white" style={{ backgroundColor: NARANJA }}>Comenzar</button>
      </div>
    </div>
  );

  // ============================ ADMIN ============================
  if (vista === "admin" && esAdmin) {
    const filas = adminDatos ? adminDatos.personas.map((p) => {
      const est = adminDatos.estado[p.id] || { r: {}, t: null };
      let resp = 0, completas = 0;
      todasLasCompetencias.forEach((c) => { const k = Object.keys(est.r[c.id] || {}).length; resp += k; if (k >= c.preguntas.length) completas++; });
      return { p, est, resp, completas };
    }) : [];
    return (
      <div className="min-h-screen pb-12">
        <Barra />
        <div className="bg-neutral-800 text-white px-5 md:px-12 py-8">
          <div className="flex items-start justify-between gap-4 flex-wrap">
            <button onClick={() => setVista("matriz")} className="text-xs uppercase tracking-widest opacity-70">← Matriz</button>
            <button onClick={cargarAdmin} className="text-xs uppercase tracking-widest px-4 py-2 border border-white/40">Actualizar</button>
          </div>
          <h1 className="uppercase text-2xl md:text-4xl font-semibold mt-4">Panel de administración</h1>
          <p className="serif text-sm opacity-80 mt-2">{adminDatos ? filas.filter((f) => f.resp > 0).length + " de " + filas.length + " personas con respuestas · datos leídos del Google Sheet" : "Leyendo el servidor…"}</p>
        </div>
        <div className="px-5 md:px-12 py-5 flex flex-wrap gap-3">
          <a href={CONFIG.SHEET_URL} target="_blank" rel="noopener noreferrer" className="px-5 py-3 uppercase text-xs tracking-widest text-white" style={{ backgroundColor: "#27AE60" }}>Abrir Google Sheet</a>
          <button disabled={!adminDatos} onClick={exportarJSON} className="px-5 py-3 uppercase text-xs tracking-widest text-white disabled:opacity-40" style={{ backgroundColor: NARANJA }}>Exportar JSON</button>
          <button disabled={!adminDatos} onClick={exportarCSV} className="px-5 py-3 uppercase text-xs tracking-widest bg-neutral-800 text-white disabled:opacity-40">Exportar CSV (largo)</button>
          <button disabled={!adminDatos} onClick={verGrupal} className="px-5 py-3 uppercase text-xs tracking-widest text-white disabled:opacity-40" style={{ backgroundColor: "#8E44AD" }}>Informe grupal</button>
        </div>
        <div className="px-5 md:px-12 overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: "640px" }}>
            <thead><tr className="text-left uppercase text-[10px] tracking-widest text-gray-400 border-b border-gray-200">
              <th className="py-2 pr-3">Persona</th><th className="py-2 pr-3">Rol</th><th className="py-2 pr-3">Respondidas</th><th className="py-2 pr-3">Competencias</th><th className="py-2 pr-3">Actualizado</th><th className="py-2">Informe</th></tr></thead>
            <tbody className="serif">
              {filas.map(({ p, est, resp, completas }) => (
                <tr key={p.id} className="border-b border-gray-100">
                  <td className="py-2.5 pr-3" style={{ fontFamily: "Oswald" }}>{p.nombre}</td>
                  <td className="py-2.5 pr-3 text-xs text-gray-500">{p.rol}</td>
                  <td className="py-2.5 pr-3">{resp}/{totalPreguntas}</td>
                  <td className="py-2.5 pr-3">{completas}/12</td>
                  <td className="py-2.5 pr-3 text-xs text-gray-500">{est.t ? new Date(est.t).toLocaleString("es-CO") : "—"}</td>
                  <td className="py-2.5">
                    <div className="flex gap-2">
                      <button
                        disabled={resp === 0}
                        onClick={() => { const html = construirInformeHTML(p.nombre, est.r); window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank"); }}
                        className="text-[10px] uppercase tracking-widest px-3 py-1.5 text-white disabled:opacity-30"
                        style={{ backgroundColor: NARANJA, fontFamily: "Oswald" }}
                      >
                        Ver
                      </button>
                      <button
                        disabled={resp === 0}
                        onClick={() => descargar("informe-" + p.id + ".html", construirInformeHTML(p.nombre, est.r), "text/html;charset=utf-8")}
                        className="text-[10px] uppercase tracking-widest px-3 py-1.5 border border-gray-400 text-gray-600 disabled:opacity-30"
                        style={{ fontFamily: "Oswald" }}
                      >
                        HTML
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="px-5 md:px-12 mt-8 max-w-3xl">
          <h2 className="uppercase text-sm tracking-widest text-gray-500 mb-2">Importar datos (JSON)</h2>
          <p className="serif text-xs text-gray-500 mb-2">Acepta el JSON exportado por esta app o por la versión anterior del cuestionario. Las respuestas se fusionan sin borrar lo existente.</p>
          <textarea value={importTexto} onChange={(e) => setImportTexto(e.target.value)} rows={6} className="w-full text-xs p-3 border border-gray-300 outline-none" style={{ fontFamily: "monospace" }} placeholder='{"datos":{"nicolas-rozo":{"r":{"c01":{"0":3}}}}}' />
          <div className="flex items-center gap-3 mt-2 flex-wrap">
            <button onClick={importarJSON} disabled={!importTexto.trim()} className="px-6 py-3 uppercase text-xs tracking-widest text-white disabled:opacity-40" style={{ backgroundColor: NARANJA }}>Validar e importar</button>
            {importMsg && <p className="serif text-xs" style={{ color: importMsg.ok ? "#27AE60" : "#E74C3C" }}>{importMsg.texto}</p>}
          </div>
        </div>
      </div>
    );
  }

  // ============================ INTRO DE COMPETENCIA ============================
  if (vista === "intro" && activa) {
    const comp = todasLasCompetencias.find((c) => c.id === activa);
    const estado = estadoDe(activa), n = contestadas(activa), total = comp.preguntas.length;
    return (
      <div className="min-h-screen flex flex-col"><Barra />
        <div className="relative overflow-hidden px-5 md:px-12 pt-5 pb-8" style={{ backgroundColor: comp.dim.bg, color: comp.dim.fg }}>
          <span className="absolute -top-4 right-2 md:right-6 text-8xl md:text-[11rem] font-bold leading-none select-none" style={{ color: comp.dim.ghost }}>{comp.num}</span>
          <button onClick={() => setVista("matriz")} className="text-xs uppercase tracking-widest opacity-80 relative z-10">← Matriz</button>
          <p className="uppercase text-xs tracking-widest opacity-70 mt-6 relative z-10">{comp.dim.nombre}</p>
          <h1 className="uppercase text-3xl md:text-5xl font-medium leading-tight max-w-2xl relative z-10">{comp.titulo}</h1>
        </div>
        <div className="flex-1 px-5 md:px-12 py-8 max-w-3xl serif">
          {(comp.descripcion || "").split("\n\n").map((parr, i) => <p key={i} className="text-neutral-800 text-base md:text-lg leading-relaxed mb-5">{parr}</p>)}
          <p className="uppercase text-[11px] tracking-widest text-gray-400 mt-6" style={{ fontFamily: "Oswald" }}>{total} preguntas · Escala de frecuencia de comportamiento</p>
        </div>
        <div className="bg-gray-100 px-5 md:px-12 py-5 flex justify-end">
          <button onClick={() => setVista("form")} className="px-12 py-4 uppercase text-sm tracking-widest text-white" style={{ backgroundColor: "#333" }}>{estado === "progreso" ? "Continuar · " + n + "/" + total : estado === "completada" ? "Revisar respuestas" : "Empezar"}</button>
        </div>
      </div>
    );
  }

  // ============================ FORMULARIO "ACTÚO ASÍ" ============================
  if (vista === "form" && activa) {
    const comp = todasLasCompetencias.find((c) => c.id === activa);
    const resp = respuestas[activa] || {}, total = comp.preguntas.length;
    const paginas = Math.ceil(total / PREGUNTAS_POR_PAGINA), desde = pagina * PREGUNTAS_POR_PAGINA;
    const grupo = comp.preguntas.slice(desde, desde + PREGUNTAS_POR_PAGINA);
    const paginaCompleta = grupo.every((_, i) => resp[desde + i] !== undefined);
    const esUltima = pagina === paginas - 1;
    const gridCols = "minmax(0,1fr) repeat(4, minmax(96px, 130px))";
    return (
      <div className="min-h-screen flex flex-col"><Barra />
        <div className="bg-neutral-800 text-white px-4 md:px-8 pt-4 pb-3">
          <div className="flex items-start justify-between">
            <button onClick={() => setVista("matriz")} className="text-xs uppercase tracking-widest opacity-70">← Matriz</button>
            <span className="uppercase text-2xl md:text-3xl font-semibold tracking-wide" style={{ color: "#EDEDED" }}>Actúo así</span>
          </div>
          <div className="hidden md:grid items-end mt-2" style={{ gridTemplateColumns: gridCols }}>
            <div className="flex items-center gap-3 pb-1"><span className="text-5xl font-bold" style={{ color: "rgba(255,255,255,0.35)" }}>{comp.num}</span><span className="uppercase tracking-wide text-base">{comp.num}. {comp.titulo}</span></div>
            {ESCALA.map((op) => <div key={op.valor} className="text-center uppercase text-[10px] tracking-wider pb-2 px-1 leading-tight">{op.etiqueta}</div>)}
          </div>
          <div className="md:hidden flex items-center gap-3 mt-2"><span className="text-4xl font-bold" style={{ color: "rgba(255,255,255,0.35)" }}>{comp.num}</span><span className="uppercase tracking-wide text-sm">{comp.num}. {comp.titulo}</span></div>
        </div>
        <div className="flex-1 px-4 md:px-8 py-4">
          <div className="hidden md:block">
            {grupo.map((texto, i) => { const q = desde + i; return (
              <div key={q} className="grid items-stretch" style={{ gridTemplateColumns: gridCols }}>
                <p className="serif py-5 pr-6 text-[15px] leading-snug text-neutral-800">{texto}</p>
                {ESCALA.map((op, col) => { const sel = resp[q] === op.valor; return (
                  <div key={op.valor} className="flex items-center justify-center" style={{ backgroundColor: col % 2 === 0 ? "#F5F5F5" : "transparent" }}>
                    <button aria-label={op.etiqueta} onClick={() => responder(activa, q, op.valor)} className="w-6 h-6 rounded-full transition-all" style={{ backgroundColor: sel ? NARANJA : "#D6D6D6", transform: sel ? "scale(1.25)" : "scale(1)" }} />
                  </div>); })}
              </div>); })}
          </div>
          <div className="md:hidden">
            {grupo.map((texto, i) => { const q = desde + i; return (
              <div key={q} className="py-4 border-b border-gray-200">
                <p className="serif text-[15px] leading-snug text-neutral-800 mb-3">{texto}</p>
                <div className="grid grid-cols-1 gap-1.5">
                  {ESCALA.map((op) => { const sel = resp[q] === op.valor; return (
                    <button key={op.valor} onClick={() => responder(activa, q, op.valor)} className="flex items-center gap-3 px-3 py-2 border text-left" style={{ borderColor: sel ? NARANJA : "#DDD", backgroundColor: sel ? "#FDF0EB" : "#FFF" }}>
                      <span className="w-4 h-4 rounded-full shrink-0" style={{ backgroundColor: sel ? NARANJA : "#D6D6D6" }} /><span className="uppercase text-[11px] tracking-wider text-neutral-700">{op.etiqueta}</span>
                    </button>); })}
                </div>
              </div>); })}
          </div>
        </div>
        <div className="px-4 md:px-8"><div className="h-1 w-full bg-neutral-700"><div className="h-1 transition-all" style={{ width: (contestadas(activa) / total * 100) + "%", backgroundColor: NARANJA }} /></div></div>
        <div className="bg-gray-100 px-4 md:px-8 py-5 flex items-center justify-between gap-4">
          <button onClick={() => setPagina((p) => Math.max(0, p - 1))} disabled={pagina === 0} className="uppercase text-xs tracking-widest text-neutral-500 disabled:opacity-0">← Anterior</button>
          <div className="flex items-center gap-4">
            {!paginaCompleta && <span className="hidden md:inline text-[11px] uppercase tracking-wide text-gray-400">Responde las {grupo.length} preguntas para continuar</span>}
            <button onClick={() => (esUltima ? setVista("matriz") : setPagina((p) => p + 1))} disabled={!paginaCompleta} className="px-10 py-4 uppercase text-sm tracking-widest bg-neutral-300 text-neutral-800 disabled:opacity-50">{esUltima ? "Finalizar" : "Siguiente"}</button>
          </div>
        </div>
      </div>
    );
  }

  // ============================ MATRIZ 3×4 ============================
  const pendiente = siguientePendiente();
  return (
    <div className="min-h-screen pb-8"><Barra />
      <div className="bg-gray-100 px-4 md:px-12 py-5">
        <button onClick={() => pendiente && abrir(pendiente, true)} disabled={!pendiente} className="w-full bg-neutral-800 text-white uppercase tracking-widest text-sm py-4 disabled:opacity-60">{pendiente ? "Continuar donde lo dejaste" : "Cuestionario completado"}</button>
        <p className="text-center text-xs text-gray-400 uppercase tracking-widest mt-2">{sesion.persona.nombre} · {contestadasGlobal}/{totalPreguntas} preguntas · {todasLasCompetencias.filter((c) => estadoDe(c.id) === "completada").length}/12 competencias</p>
      </div>
      {DIMENSIONES.map((dim) => (
        <div key={dim.id} className="flex flex-row px-2 md:px-5 mt-3 md:mt-5 gap-2 md:gap-3">
          <div className="w-6 md:w-12 flex items-center justify-center shrink-0"><span className="vertical-label uppercase font-semibold tracking-widest text-neutral-800 text-[10px] md:text-lg">{dim.nombre}</span></div>
          <div className="flex-1 grid grid-cols-3 gap-2 md:gap-3">
            {dim.competencias.map((comp) => {
              const estado = estadoDe(comp.id), n = contestadas(comp.id), total = comp.preguntas.length;
              const etiqueta = estado === "completada" ? "COMPLETADA" : estado === "progreso" ? "CONTINUAR" : "EMPEZAR";
              return (
                <button key={comp.id} onClick={() => abrir(comp.id, false)} className="relative text-left p-2.5 md:p-6 min-h-32 md:min-h-72 flex flex-col justify-between overflow-hidden hover:scale-[1.015] transition-transform" style={{ backgroundColor: dim.bg, color: dim.fg }}>
                  <span className="absolute top-1 right-1.5 md:top-4 md:right-4 text-4xl md:text-9xl font-bold leading-none select-none" style={{ color: dim.ghost }}>{comp.num}</span>
                  <h2 className="uppercase text-[10px] md:text-2xl font-medium leading-tight pr-5 md:pr-16 relative z-10 mt-5 md:mt-14">{comp.titulo}</h2>
                  <div className="relative z-10 flex items-end justify-between gap-1.5 md:gap-3 mt-3 md:mt-6">
                    <div className="flex-1 min-w-0">
                      <p className="uppercase text-[7px] md:text-[11px] tracking-wide md:tracking-widest mb-1 md:mb-1.5 opacity-90 truncate">{etiqueta}{estado === "progreso" ? " · " + n + "/" + total : ""}</p>
                      <div className="h-0.5 w-full" style={{ backgroundColor: "rgba(0,0,0,0.25)" }}><div className="h-0.5" style={{ width: (estado === "completada" ? 100 : n / total * 100) + "%", backgroundColor: dim.id === "comunicacion" ? "#FFF" : NARANJA }} /></div>
                    </div>
                    <span className="w-5 h-5 md:w-10 md:h-10 rounded-full border flex items-center justify-center text-xs md:text-xl font-light shrink-0" style={{ borderColor: dim.fg, color: dim.fg }}>{estado === "completada" ? "✓" : "+"}</span>
                  </div>
                </button>);
            })}
          </div>
        </div>
      ))}
      <div className="bg-gray-100 px-4 md:px-12 py-5 mt-6 flex flex-col md:flex-row gap-3">
        <button onClick={() => pendiente && abrir(pendiente, true)} disabled={!pendiente} className="flex-1 bg-neutral-800 text-white uppercase tracking-widest text-sm py-4 disabled:opacity-60">{pendiente ? "Continuar donde lo dejaste" : "Cuestionario completado"}</button>
        {esAdmin && <button onClick={() => { setVista("admin"); cargarAdmin(); }} className="md:w-64 bg-neutral-900 text-white uppercase tracking-widest text-sm py-4 border border-neutral-700">Panel admin</button>}
        <button onClick={cerrarSesion} className="md:w-52 bg-neutral-400 text-white uppercase tracking-widest text-sm py-4">Cerrar sesión</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
